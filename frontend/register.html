<script type="module">
    import { initLoginRegisterPages, register } from "./js/auth.js";
    window.register = register;
    initLoginRegisterPages();
</script>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - KeepPass</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="register-page">
<header class="site-header">
    <h1 class="site-title">KeepPass</h1>
    <p class="site-tagline">Stockez, gérez et sécurisez vos mots de passe facilement.</p>
</header>
<div id="registerPage" class="page">
    <div class="container">
        <div class="card">
            <form onsubmit="register(); return false;" id="registerForm">
                <h2>Inscription</h2>
                <input type="email" id="email" placeholder="Email" />
                <input type="text" id="firstname" placeholder="Prénom" />
                <input type="text" id="lastname" placeholder="Nom" />
                <input type="password" id="password" placeholder="Mot de passe (min 8 caractères)" />
                <input type="password" id="passwordConfirm" placeholder="Confirmer le mot de passe" 
                    onpaste="return false" oncopy="return false" oncut="return false" />
                <button type="submit">S'inscrire</button>
                <p class="switch-link">
                    Déjà un compte ? <a href="login.html">Se connecter</a>
                </p>
            </form>
            <div id="authError" class="error"></div>
        </div>
    </div>
</div>
<footer class="site-footer">
    <p>© 2025 - KeepPass • Sécurisé & Privé</p>
</footer>
</body>
<div class="bg-shape bg-purple"></div>
<div class="bg-shape bg-blue"></div>
<div class="bg-shape bg-cyan"></div>
</html>
