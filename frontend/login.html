<script type="module">
    import { initLoginRegisterPages, login } from "./js/auth.js";
    window.login = login;
    initLoginRegisterPages();
</script>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Gestionnaire de MDP</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="loginPage" class="page">
    <div class="container">
        <div class="card">
            <h1>🔐 Gestionnaire de Mots de Passe</h1>
            <div id="loginForm">
                <h2>Connexion</h2>
                <input type="email" id="email" placeholder="Email" />
                <input type="password" id="password" placeholder="Mot de passe" />
                <button onclick="login()">Se connecter</button>
                <p class="switch-link">
                    Pas de compte ? <a href="register.html">S'inscrire</a>
                </p>
            </div>
            <div id="authError" class="error"></div>
        </div>
    </div>
</div>

</body>
</html>
