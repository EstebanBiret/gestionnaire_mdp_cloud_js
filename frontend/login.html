<script type="module">
    import { initLoginRegisterPages, login } from "./js/auth.js";
    window.login = login;
    initLoginRegisterPages();
</script>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - KeepPass</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">
<header class="site-header">
    <h1 class="site-title">KeepPass</h1>
    <p class="site-tagline">Stockez, gérez et sécurisez vos mots de passe facilement.</p>
</header>
<div id="loginPage" class="page">
    <div class="container">
        <div class="card">
            <form onsubmit="login(); return false;" id="loginForm">
                <h2>Connexion</h2>
                <input type="email" id="email" placeholder="Email" />
                <input type="password" id="password" placeholder="Mot de passe" />
                <button type="submit">Se connecter</button>
                <p class="switch-link">
                    Pas de compte ? <a href="register.html">S'inscrire</a>
                </p>
            </form>
            <div id="authError" class="error"></div>
        </div>
    </div>
</div>

<footer class="site-footer">
    <p>© 2025 - KeepPass • Sécurisé & Privé</p>
</footer>

</body>
<div class="bg-shape bg-purple"></div>
<div class="bg-shape bg-blue"></div>
<div class="bg-shape bg-cyan"></div>
</html>
